name: Tests

# The plugin's tests against a stock RotorHazard server (upstream main).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Plugin tests (RotorHazard main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: ⤵️ Check out RotorHazard
        uses: actions/checkout@v7.0.1
        with:
          repository: RotorHazard/RotorHazard
          ref: main
          path: tests/.rotorhazard

      - name: 🏗 Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: 🏗 Install RotorHazard's dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/.rotorhazard/src/server/reqsNonPi.txt pytest

      - name: 🚀 Run the tests
        env:
          RH_SERVER_DIR: tests/.rotorhazard
        run: python -m pytest tests -v
