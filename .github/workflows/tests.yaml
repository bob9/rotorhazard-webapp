name: Tests

# The plugin's tests against stock RotorHazard servers: every supported release and main.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Plugin tests (RotorHazard ${{ matrix.rotorhazard }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rotorhazard: [v4.3.1, v4.4.0, v4.5.0-beta.2, main]
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: ⤵️ Check out RotorHazard
        uses: actions/checkout@v7.0.1
        with:
          repository: RotorHazard/RotorHazard
          ref: ${{ matrix.rotorhazard }}
          path: tests/.rotorhazard

      - name: 🏗 Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: 🏗 Install RotorHazard's dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/.rotorhazard/src/server/reqsNonPi.txt pytest
          # RotorHazard 4.3 pins Flask-SocketIO 5.4, which does not work with Flask 3.1.3+
          if [ "${{ matrix.rotorhazard }}" = "v4.3.1" ]; then python -m pip install "Flask==3.1.0"; fi

      - name: 🚀 Run the tests
        env:
          RH_SERVER_DIR: tests/.rotorhazard
        run: python -m pytest tests -v
